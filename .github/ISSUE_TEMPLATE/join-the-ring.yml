name: 🎡 Join the funscroll ring
description: Send your funscrollable website to the webring.
title: "[ring] "
labels: ["webring"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for building a different internet! Tell us about your site.
        A funscrollable site plays with the scroll, has some kind of ending, and lets people leave.
  - type: input
    id: name
    attributes:
      label: Site name
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What makes it funscrollable?
      description: One or two lines. What moves, what surprises, how does it end?
    validations:
      required: true
  - type: dropdown
    id: concept
    attributes:
      label: Which funscroll concept fits it best?
      options: [frolic, whimsical, float, dance, move, say, image, think, no idea!]
  - type: checkboxes
    id: widget
    attributes:
      label: The ring
      options:
        - label: I added (or will add) the ring widget to my site
